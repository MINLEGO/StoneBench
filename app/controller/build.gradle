plugins { id 'fabric-loom' version '1.14.10' }
version = '0.1.0'
group = 'stonebench'
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
def observationChecksWorkingDir = layout.buildDirectory.dir('tmp/observationChecks').get().asFile
tasks.register('observationChecks', JavaExec) {
    group = 'verification'
    description = 'Runs focused assertion-based checks for observation serialization, continuity, comparison, and artifacts.'
    dependsOn tasks.named('testClasses')
    // The assertion runner needs the game/compile libraries, not Loom's interactive dev launcher.
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
    mainClass = 'stonebench.ObservationChecks'
    workingDir = observationChecksWorkingDir
    doFirst {
        project.delete(observationChecksWorkingDir)
        if (!observationChecksWorkingDir.mkdirs() && !observationChecksWorkingDir.isDirectory()) {
            throw new GradleException('Could not create isolated observation-check working directory')
        }
    }
    doLast {
        project.delete(observationChecksWorkingDir)
    }
}
tasks.named('check') {
    dependsOn tasks.named('observationChecks')
}
def streamingChecksWorkingDir = layout.buildDirectory.dir('tmp/streamingChecks').get().asFile
def streamingChecksCleanup = tasks.register('cleanStreamingChecks', Delete) {
    delete streamingChecksWorkingDir
}
tasks.register('streamingChecks', JavaExec) {
    group = 'verification'
    description = 'Runs bounded-heap checks for streaming observation artifacts and trace comparison.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
    mainClass = 'stonebench.StreamingChecks'
    maxHeapSize = '96m'
    workingDir = streamingChecksWorkingDir
    finalizedBy streamingChecksCleanup
    doFirst {
        project.delete(streamingChecksWorkingDir)
        if (!streamingChecksWorkingDir.mkdirs() && !streamingChecksWorkingDir.isDirectory()) {
            throw new GradleException('Could not create isolated streaming-check working directory')
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('streamingChecks')
}
tasks.named('test') { enabled = false } // No JUnit engine; observationChecks is the executable verification suite.
def inputChecksDir = layout.buildDirectory.dir('tmp/inputChecks').get().asFile
tasks.register('inputChecks', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
    mainClass = 'stonebench.InputComparisonChecks'
    workingDir = inputChecksDir
    doFirst { inputChecksDir.mkdirs() }
    doLast { project.delete(inputChecksDir) }
}
tasks.named('check') { dependsOn tasks.named('inputChecks') }

tasks.register('restChecks', JavaExec) {
    group = 'verification'
    description = 'Runs conservative transition classification and negative controls.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
    mainClass = 'stonebench.RestChecks'
}
tasks.named('check') { dependsOn tasks.named('restChecks') }
